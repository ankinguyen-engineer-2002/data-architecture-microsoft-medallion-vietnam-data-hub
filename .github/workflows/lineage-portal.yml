name: Build Lineage Portal

on:
  workflow_dispatch:
    inputs:
      scan_mode:
        description: "Snapshot source for this run"
        type: choice
        required: true
        default: fixture
        options:
          - fixture
          - live
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-lineage-portal
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Microsoft ODBC Driver 18
        run: |
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc >/dev/null
          curl -sSL https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list >/dev/null
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip pyodbc

      - name: Build fixture lineage snapshot
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.scan_mode == 'fixture' }}
        working-directory: 05_tools/06_lineage_portal
        run: python -m scanner.cli --fixture tests/fixtures/minimal_live_input.json --out site/public/lineage_snapshot.json

      - name: Build live lineage snapshot
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.scan_mode == 'live' }}
        working-directory: 05_tools/06_lineage_portal
        env:
          FABRIC_TENANT_ID: ${{ secrets.FABRIC_TENANT_ID || secrets.AZURE_TENANT_ID }}
          FABRIC_CLIENT_ID: ${{ secrets.FABRIC_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          FABRIC_CLIENT_SECRET: ${{ secrets.FABRIC_CLIENT_SECRET || secrets.AZURE_CLIENT_SECRET }}
          FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
          FABRIC_WORKSPACE_NAME: ${{ secrets.FABRIC_WORKSPACE_NAME }}
          FABRIC_SQL_SERVER: ${{ secrets.FABRIC_SQL_SERVER || secrets.FABRIC_SERVER }}
          FABRIC_SEMANTIC_MODEL_ID: ${{ secrets.FABRIC_SEMANTIC_MODEL_ID }}
          FABRIC_SEMANTIC_MODEL_NAME: ${{ secrets.FABRIC_SEMANTIC_MODEL_NAME }}
        run: python -m scanner.cli --out site/public/lineage_snapshot.json

      - name: Secret scan generated snapshot
        working-directory: 05_tools/06_lineage_portal
        run: |
          ! grep -E -i "(client_secret|api[_-]?key|bearer |password|BEGIN PRIVATE KEY)" site/public/lineage_snapshot.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: 05_tools/06_lineage_portal/site/package-lock.json

      - name: Install frontend dependencies
        working-directory: 05_tools/06_lineage_portal/site
        run: npm ci

      - name: Build static site
        working-directory: 05_tools/06_lineage_portal/site
        env:
          NEXT_PUBLIC_BASE_PATH: /data-architecture-microsoft-medallion-vietnam-data-hub
        run: npm run build

      - name: Typecheck frontend
        working-directory: 05_tools/06_lineage_portal/site
        run: npm run typecheck

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 05_tools/06_lineage_portal/site/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
