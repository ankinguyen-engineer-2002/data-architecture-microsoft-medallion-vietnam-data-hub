# Query Governor Configuration

# Thresholds
kill_threshold_seconds: 30  # TEST MODE: 30 giây - sau test đổi lại 600

# Warehouses to monitor
warehouses:
  - SupplyChain_Processing_Warehouse
  - SupplyChain_Gold_Warehouse

# Exclusion rules - queries matching any rule below will NOT be killed
exclusions:
  # Stored procedures (already optimized)
  procedure_patterns:
    - "Usp_"
    - "usp_"
    - "sp_"
  
  # ETL workload keywords
  etl_keywords:
    - "INSERT"
    - "UPDATE"
    - "DELETE"
    - "MERGE"
    - "COPY INTO"
  
  # System/service accounts
  login_names:
    - "PowerBIService"
    - "System"

# Wait types to exclude (queries waiting, not consuming CU)
excluded_wait_types:
  - "LCK_M_S"           # Shared lock wait
  - "LCK_M_X"           # Exclusive lock wait
  - "PAGEIOLATCH_SH"    # Page I/O latch wait
  - "PAGEIOLATCH_EX"    # Page I/O latch exclusive
  - "WRITELOG"          # Log write wait

# Runtime settings
iterations: 9           # Number of check iterations per run
interval_seconds: 30    # Seconds between iterations
