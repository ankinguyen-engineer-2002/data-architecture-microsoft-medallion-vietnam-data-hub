name: main
description: Full SupplyChain all-mart refresh order — 11 fail-fast wrapper SP job steps with a blocking Forecast DQ gate before Inventory.
workspace_id: c8d9fc83-18b6-4e1d-8264-0b49eed36fe0
pipeline:
  api: wrapper_sp
  description: Direct SP execution via pyodbc/az token or SQL Agent job steps.
default_mode: dry_run
wave_algorithm: topological_kahn_catalog_floor
wrapper_procedures:
  - step: 10
    database: SupplyChain_Processing_Warehouse
    schema: dbo
    procedure: Usp_Refresh_Shared_ReferenceMaster
    purpose: Shared ReferenceMaster prerequisites.
  - step: 20
    database: SupplyChain_Processing_Warehouse
    schema: dbo
    procedure: Usp_Refresh_Shared_Staging
    purpose: Shared Staging.DemandForecastSnapshotDaily prerequisite.
  - step: 30
    database: SupplyChain_Processing_Warehouse
    schema: dbo
    procedure: Usp_Refresh_ForecastAccuracy_Silver_W01
    purpose: Forecast Accuracy Silver W01 line-level tables.
  - step: 40
    database: SupplyChain_Processing_Warehouse
    schema: dbo
    procedure: Usp_Refresh_ForecastAccuracy_Silver_W02
    purpose: Forecast Accuracy Silver W02 aggregate tables.
  - step: 50
    database: SupplyChain_Processing_Warehouse
    schema: dbo
    procedure: Usp_Refresh_ForecastAccuracy_Silver_W03
    purpose: Forecast Accuracy Silver W03 derived forecast table.
  - step: 60
    database: SupplyChain_Gold_Warehouse
    schema: dbo
    procedure: Usp_Refresh_ForecastAccuracy_Gold
    purpose: Forecast Accuracy Gold monolithic wrapper.
  - step: 70
    database: SupplyChain_Processing_Warehouse
    schema: DataQuality
    procedure: usp_RunAndGateForecastAccuracyPublish
    purpose: Persist and gate the exact Forecast DQ run; THROW 50003 blocks downstream steps.
  - step: 80
    database: SupplyChain_Processing_Warehouse
    schema: dbo
    procedure: Usp_Refresh_InventoryHealth_Silver_W01
    purpose: Inventory Health Silver W01 inventory source transformations.
  - step: 90
    database: SupplyChain_Processing_Warehouse
    schema: dbo
    procedure: Usp_Refresh_InventoryHealth_Silver_W02
    purpose: Inventory Health Silver W02 derived tables.
  - step: 100
    database: SupplyChain_Processing_Warehouse
    schema: dbo
    procedure: Usp_Refresh_InventoryHealth_Silver_W03
    purpose: Inventory Health Silver W03 dependent helpers.
  - step: 110
    database: SupplyChain_Gold_Warehouse
    schema: dbo
    procedure: Usp_Refresh_InventoryHealth_Gold
    purpose: Inventory Health Gold monolithic wrapper.
post_run_checks:
  - Enterprise ETL AuditLog has Process Complete for all physical table loads
  - TableDictionary load contracts match the intended UpdateMethod; do not use its RowCount as overwrite-load proof
  - Forecast DQ exact run is persisted with PublishAllowed = 1
  - No grain duplicates on critical snapshot grains
  - Direct Gold/current-view counts and parity checks are within expected tolerance
  - Semantic smoke passes if report-facing objects changed
